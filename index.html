<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT SMP Negeri 3 Ubud - Secured & Auto-Resume</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], processEscapes: true },
            options: { enableMenu: false }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        body { background-color: #f8fafc; user-select: none; -webkit-user-select: none; font-family: 'Segoe UI', sans-serif; }
        .header-blue { background-color: #1e3a8a; }
        .question-nav { cursor: pointer; border: 2px solid #e2e8f0; min-width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; border-radius: 10px; font-weight: 800; transition: 0.3s; background: white; }
        .question-nav.active { background-color: #1e3a8a; color: white; border-color: #1e3a8a; transform: scale(1.1); }
        .question-nav.done { background-color: #10b981; color: white; border-color: #10b981; }
        .hidden { display: none; }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        #securityOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; color: white; text-align: center; padding-top: 20%; }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="securityOverlay">
    <h1 class="text-4xl font-black mb-4">AKSES DIBLOKIR</h1>
    <p class="text-xl">Jangan gunakan Split Screen atau mengecilkan jendela browser!<br>Kembalikan ke layar penuh untuk melanjutkan.</p>
</div>

<div class="header-blue p-4 text-white flex items-center shadow-xl sticky top-0 z-50">
  <img src="https://i.ibb.co.com/SY0R8c8/images.jpg" class="h-6 mr-2 bg-white p-1 rounded shadow-sm">
  <div>
    <h1 class="text-xl font-black uppercase leading-none">CBT SMPN 3 UBUD</h1>
    <p class="text-[9px] tracking-[0.1em] opacity-80 uppercase font-bold">Auto-Resume System Active</p>
  </div>
</div>

<div id="app" class="container mx-auto p-4 max-w-6xl">
  
  <div id="loginPage" class="max-w-md mx-auto bg-white p-10 rounded-3xl shadow-2xl mt-10 border border-gray-100 fade-in">
    <div class="text-center mb-8">
      <img src="https://i.ibb.co.com/SY0R8c8/images.jpg" class="h-24 w-24 mx-auto mb-6">
      <h2 class="text-3xl font-black text-gray-800">Login Sistem</h2>
    </div>
    <div class="space-y-5">
      <select id="kelas" class="w-full border-2 p-4 rounded-2xl bg-gray-50 outline-none focus:ring-4 focus:ring-blue-100">
        <option value="">-- Pilih Kelas --</option>
        <option>7A</option><option>7B</option><option>7C</option><option>7D</option><option>7E</option><option>7F</option><option>8A</option><option>8B</option><option>8C</option><option>8D</option><option>8E</option><option>8F</option><option>8G</option><option>9A</option><option>9B</option><option>9C</option><option>9D</option><option>9E</option><option>9F</option><option>9G</option><option>9H</option>
      </select>
      <input type="text" id="username" placeholder="Username" class="w-full border-2 p-4 rounded-2xl bg-gray-50 outline-none">
      <input type="password" id="password" placeholder="Password" class="w-full border-2 p-4 rounded-2xl bg-gray-50 outline-none">
      <div class="flex gap-4">
        <button onclick="handleLogin('siswa')" class="w-1/2 bg-blue-700 text-white p-5 rounded-2xl font-black uppercase">SISWA</button>
        <button onclick="handleLogin('guru')" class="w-1/2 bg-emerald-600 text-white p-5 rounded-2xl font-black uppercase">GURU</button>
      </div>
    </div>
  </div>

  <div id="subjectPage" class="hidden text-center mt-10 fade-in">
    <div class="bg-white p-12 rounded-3xl shadow-2xl max-w-lg mx-auto">
      <h2 id="welcomeUser" class="text-2xl font-black mb-8 text-gray-800"></h2>
      <select id="mapel" class="w-full border-2 p-4 rounded-2xl text-lg font-bold bg-gray-50">
          <option>Matematika</option><option>Bahasa Indonesia</option><option>IPA</option><option>IPS</option><option>Bahasa Inggris</option>
      </select>
      <button id="btnMulai" onclick="startExamSequence()" class="mt-8 bg-blue-700 text-white w-full py-5 rounded-2xl font-black text-xl shadow-xl">MULAI SEKARANG</button>
    </div>
  </div>

  <div id="examPage" class="hidden grid grid-cols-12 gap-6 mt-4 fade-in">
    <div class="col-span-12 lg:col-span-9 bg-white p-8 rounded-3xl shadow-2xl border border-gray-100">
      <div class="flex justify-between border-b pb-5 mb-8 items-center">
        <div><span id="labelMode" class="px-3 py-1 rounded-lg text-xs font-bold mr-2"></span><span class="font-black text-gray-700 text-lg" id="infoNomor"></span></div>
        <div class="bg-red-50 text-red-600 px-6 py-2 rounded-2xl border-2 border-red-100 font-black text-xl" id="timer">00:00</div>
      </div>
      <div id="soalContainer"></div>
      <div class="flex justify-between mt-12 pt-8 border-t-2 border-gray-50">
        <button id="prevBtn" onclick="changeSoal(-1)" class="bg-gray-100 px-10 py-4 rounded-2xl font-black">SEBELUMNYA</button>
        <button id="nextBtn" onclick="changeSoal(1)" class="bg-blue-700 text-white px-10 py-4 rounded-2xl font-black">BERIKUTNYA</button>
        <button id="finishBtn" onclick="handleStepTransition()" class="hidden bg-emerald-600 text-white px-10 py-4 rounded-2xl font-black">KUMPULKAN</button>
      </div>
    </div>
    <div class="col-span-12 lg:col-span-3 bg-white p-6 rounded-3xl shadow-2xl border h-fit sticky top-24">
      <div class="flex gap-2 mb-6">
        <button id="btnTabPG" onclick="switchMode('PG')" class="flex-1 py-2 rounded-xl font-bold text-xs border-2">PG</button>
        <button id="btnTabESAI" onclick="switchMode('ESAI')" class="flex-1 py-2 rounded-xl font-bold text-xs border-2">ESAI</button>
      </div>
      <div id="navGrid" class="flex flex-wrap gap-3 justify-center"></div>
    </div>
  </div>

  <div id="teacherDashboard" class="hidden mt-6 fade-in">
    <div class="bg-white p-8 rounded-3xl shadow-2xl border-t-[12px] border-emerald-600">
      <h2 class="text-3xl font-black text-gray-800 mb-6">Monitoring Nilai</h2>
      <select id="selKls" onchange="loadRekap(this.value)" class="border-2 p-3 rounded-xl w-64 font-bold mb-6">
          <option value="">-- Pilih Kelas --</option>
          <option>7A</option><option>7B</option><option>8A</option><option>9A</option>
      </select>
      <div id="absensiDiv" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
    </div>
  </div>

</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbwfM6Cy1PHADts5SIPWkDsRUW6RrMF_U817SAt1NOBc2p36ehlzXUx-5-v9KKyMxr-wJQ/exec";

  let userData = {}, questionsPG = [], questionsESAI = [], questions = [], pgKunci = [], currentIdx = 0, answers = {}, timeLeft = 0, timerInterval, currentMode = 'PG', examConfig = {}, cheatCount = 0, cheatLog = [];

  // --- SISTEM AUTO SAVE & RESUME ---
  function saveProgress() {
    if (!userData.nama) return;
    const session = { userData, questionsPG, questionsESAI, pgKunci, answers, timeLeft, currentIdx, currentMode, examConfig, cheatCount, cheatLog, timestamp: new Date().getTime() };
    localStorage.setItem('cbt_session', JSON.stringify(session));
  }

  function loadProgress() {
    const saved = localStorage.getItem('cbt_session');
    if (saved) {
      const data = JSON.parse(saved);
      // Validasi sesi (max 4 jam)
      if (new Date().getTime() - data.timestamp > 4 * 60 * 60 * 1000) return localStorage.removeItem('cbt_session');

      userData = data.userData; questionsPG = data.questionsPG; questionsESAI = data.questionsESAI;
      pgKunci = data.pgKunci; answers = data.answers; timeLeft = data.timeLeft;
      currentIdx = data.currentIdx; currentMode = data.currentMode; examConfig = data.examConfig;
      cheatCount = data.cheatCount; cheatLog = data.cheatLog;

      document.getElementById('loginPage').classList.add('hidden');
      document.getElementById('subjectPage').classList.add('hidden');
      document.getElementById('examPage').classList.remove('hidden');
      
      startTimer();
      switchMode(currentMode);
      showSoal(currentIdx);
    }
  }

  window.onload = loadProgress;

  // --- LOGIKA CORE ---
  async function callGAS(action, data = {}) {
    const res = await fetch(GAS_URL, { method: "POST", body: JSON.stringify({ action, ...data }) });
    return await res.json();
  }

  async function handleLogin(role) {
    const kls = document.getElementById('kelas').value, user = document.getElementById('username').value, pass = document.getElementById('password').value;
    const res = await callGAS('loginUser', { kelas: kls, username: user, password: pass, role: role });
    if (res && res.success) {
      userData = { ...res, kelas: kls };
      document.getElementById('loginPage').classList.add('hidden');
      if (role === 'siswa') {
        document.getElementById('subjectPage').classList.remove('hidden');
        document.getElementById('welcomeUser').innerText = "Halo, " + res.nama;
      } else { document.getElementById('teacherDashboard').classList.remove('hidden'); }
    } else alert("Login Gagal!");
  }

  async function startExamSequence() {
    const mapel = document.getElementById('mapel').value;
    timeLeft = 60 * 60; // Default 60 menit
    
    document.getElementById('btnMulai').innerText = "MEMUAT...";
    const config = await callGAS('getExamConfig', { mapel, tingkat: userData.kelas.substring(0,1) });
    
    if (config) {
      const [resPG, resESAI] = await Promise.all([
        callGAS('fetchQuestions', { url: config.pgUrl, type: 'PG' }),
        callGAS('fetchQuestions', { url: config.esaiUrl, type: 'ESAI' })
      ]);
      questionsPG = resPG; questionsESAI = resESAI;
      pgKunci = resPG.map(q => q.kunci);
      examConfig = config;
      
      document.getElementById('subjectPage').classList.add('hidden');
      document.getElementById('examPage').classList.remove('hidden');
      startTimer();
      switchMode('PG');
      saveProgress();
    }
  }

  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      let m = Math.floor(timeLeft / 60), s = timeLeft % 60;
      document.getElementById('timer').innerText = `${m}:${s < 10 ? '0'+s : s}`;
      if (timeLeft <= 0) { clearInterval(timerInterval); finalSubmit("Waktu Habis"); }
      timeLeft--;
      if (timeLeft % 10 === 0) saveProgress(); // Auto save tiap 10 detik
    }, 1000);
  }

  function switchMode(mode) {
    currentMode = mode;
    questions = (mode === 'PG') ? questionsPG : questionsESAI;
    renderNav();
    showSoal(0);
    
    // UI Tab Update
    const isPG = mode === 'PG';
    document.getElementById('btnTabPG').className = isPG ? "flex-1 py-2 rounded-xl font-bold bg-blue-700 text-white" : "flex-1 py-2 rounded-xl font-bold bg-white text-gray-400";
    document.getElementById('btnTabESAI').className = !isPG ? "flex-1 py-2 rounded-xl font-bold bg-emerald-600 text-white" : "flex-1 py-2 rounded-xl font-bold bg-white text-gray-400";
  }

  function showSoal(idx) {
    currentIdx = idx;
    const q = questions[idx];
    if (!q) return;
    
    document.getElementById('infoNomor').innerText = "Nomor " + (idx + 1);
    let h = q.img ? `<img src="${q.img}" class="max-w-full h-48 mx-auto mb-6 rounded">` : '';
    h += `<div class="text-xl mb-6 font-bold">${q.soal}</div>`;
    
    if (currentMode === 'PG') {
      ['a','b','c','d'].forEach(o => {
        const val = o.toUpperCase();
        const ch = answers["PG_"+idx] === val ? 'checked' : '';
        h += `<label class="block p-4 border rounded-xl mb-3 cursor-pointer hover:bg-blue-50"><input type="radio" name="opt" value="${val}" ${ch} onclick="saveAns('${val}')"> ${val}. ${q[o]}</label>`;
      });
    } else {
      h += `<textarea oninput="saveAns(this.value)" class="w-full border-2 p-4 rounded-xl h-40">${answers["ESAI_"+idx] || ""}</textarea>`;
    }

    document.getElementById('soalContainer').innerHTML = h;
    MathJax.typesetPromise();
    updateNavUI();
    saveProgress();
  }

  function saveAns(v) { 
    answers[currentMode + "_" + currentIdx] = v; 
    updateNavUI(); 
  }

  function renderNav() {
    let h = '';
    questions.forEach((_, i) => h += `<div id="nav-${i}" onclick="showSoal(${i})" class="question-nav shadow-sm">${i + 1}</div>`);
    document.getElementById('navGrid').innerHTML = h;
  }

  function updateNavUI() {
    document.querySelectorAll('.question-nav').forEach((el, i) => {
      el.classList.remove('active', 'done');
      if (i === currentIdx) el.classList.add('active');
      if (answers[currentMode + "_" + i]) el.classList.add('done');
    });
  }

  function changeSoal(s) { showSoal(currentIdx + s); }

  async function finalSubmit(status) {
    clearInterval(timerInterval);
    localStorage.removeItem('cbt_session');
    document.getElementById('examPage').innerHTML = "<div class='text-center py-20 font-black'>MENGIRIM JAWABAN...</div>";
    await callGAS('processFinalSubmit', { kelas: userData.kelas, row: userData.row, answers, pgKunci, status, pelanggaran: cheatCount, catatan: cheatLog.join("\n") });
    alert("Berhasil!"); location.reload();
  }

  function handleStepTransition() { if(confirm("Kumpulkan?")) finalSubmit("Selesai Normal"); }

  // Security: Prevent Exit
  window.addEventListener('blur', () => {
    if (timeLeft > 0) {
        cheatCount++;
        cheatLog.push(`[${new Date().toLocaleTimeString()}] Keluar Tab`);
        alert("Jangan keluar dari halaman ujian! Pelanggaran: " + cheatCount);
        if (cheatCount >= 5) finalSubmit("Diskualifikasi");
    }
  });

  window.addEventListener('beforeunload', (e) => {
    if (timeLeft > 0) { e.preventDefault(); e.returnValue = ''; }
  });
</script>
</body>
</html>
