<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT SMPN 3 Ubud - Auto Resume</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { background: #f1f5f9; user-select: none; font-family: 'Inter', sans-serif; }
        .question-nav { cursor: pointer; border: 2px solid #e2e8f0; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-weight: bold; background: #fff; }
        .question-nav.active { background: #1e3a8a; color: #fff; border-color: #1e3a8a; }
        .question-nav.done { background: #10b981; color: #fff; border-color: #10b981; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="app" class="p-4 max-w-5xl mx-auto">
    <div class="bg-blue-900 text-white p-4 rounded-xl shadow-lg flex justify-between items-center mb-6">
        <h1 class="font-bold text-lg uppercase">CBT SMPN 3 UBUD</h1>
        <div id="timerDisplay" class="bg-red-600 px-4 py-1 rounded-lg font-mono font-bold hidden text-xl">00:00</div>
    </div>

    <div id="loginPage" class="bg-white p-8 rounded-2xl shadow-xl max-w-md mx-auto">
        <h2 class="text-2xl font-black text-center mb-6">LOGIN</h2>
        <select id="kelas" class="w-full border p-3 rounded-lg mb-4 bg-gray-50">
            <option value="">Pilih Kelas</option>
            <option>7A</option><option>7B</option><option>8A</option><option>8B</option><option>9A</option><option>9B</option>
        </select>
        <input type="text" id="username" placeholder="Username" class="w-full border p-3 rounded-lg mb-4 bg-gray-50">
        <input type="password" id="password" placeholder="Password" class="w-full border p-3 rounded-lg mb-6 bg-gray-50">
        <div class="flex gap-2">
            <button onclick="handleLogin('siswa')" class="w-full bg-blue-700 text-white p-3 rounded-lg font-bold">SISWA</button>
            <button onclick="handleLogin('guru')" class="w-full bg-emerald-600 text-white p-3 rounded-lg font-bold">GURU</button>
        </div>
    </div>

    <div id="subjectPage" class="hidden bg-white p-8 rounded-2xl shadow-xl max-w-lg mx-auto text-center">
        <h2 id="welcomeUser" class="text-xl font-bold mb-4"></h2>
        <select id="mapel" class="w-full border p-3 rounded-lg mb-6 text-lg">
            <option>Matematika</option><option>IPA</option><option>IPS</option><option>Bahasa Inggris</option><option>Bahasa Indonesia</option>
        </select>
        <button id="btnMulai" onclick="startExamSequence()" class="w-full bg-blue-800 text-white py-4 rounded-xl font-black text-lg">MULAI UJIAN</button>
    </div>

    <div id="examPage" class="hidden grid grid-cols-12 gap-6">
        <div class="col-span-12 lg:col-span-9 bg-white p-6 rounded-2xl shadow-lg border">
            <div id="labelMode" class="font-bold text-blue-800 mb-2 uppercase text-sm">Pilihan Ganda</div>
            <div id="soalContainer" class="min-h-[300px]"></div>
            <div class="flex justify-between mt-8 border-t pt-6">
                <button id="prevBtn" onclick="changeSoal(-1)" class="bg-gray-200 px-6 py-3 rounded-lg font-bold">KEMBALI</button>
                <button id="nextBtn" onclick="changeSoal(1)" class="bg-blue-700 text-white px-6 py-3 rounded-lg font-bold">LANJUT</button>
                <button id="finishBtn" onclick="handleStepTransition()" class="hidden bg-emerald-600 text-white px-6 py-3 rounded-lg font-bold">SELESAI</button>
            </div>
        </div>
        <div class="col-span-12 lg:col-span-3 bg-white p-4 rounded-2xl shadow-lg border h-fit">
            <div class="flex gap-2 mb-4">
                <button onclick="switchMode('PG')" class="flex-1 border-2 p-2 rounded-lg font-bold text-xs bg-blue-100 border-blue-700">PG</button>
                <button onclick="switchMode('ESAI')" class="flex-1 border-2 p-2 rounded-lg font-bold text-xs">ESAI</button>
            </div>
            <div id="navGrid" class="flex flex-wrap gap-2 justify-center"></div>
        </div>
    </div>
</div>

<script>
    // MASUKKAN URL WEB APP ANDA DI SINI
    const GAS_URL = "https://script.google.com/macros/s/AKfycby3PDIuB801D8M2i092GXL-jLqAjYTfC4MvjWYmtzGdxhsZbPFKhRTCR1FvrKn74cPmHQ/exec";

    let userData = {}, questionsPG = [], questionsESAI = [], questions = [], pgKunci = [], 
        currentIdx = 0, answers = {}, timeLeft = 3600, timerInterval, currentMode = 'PG', 
        cheatCount = 0, cheatLog = [];

    // --- AUTO RESUME LOGIC ---
    function saveToLocal() {
        if (!userData.nama) return;
        const data = { userData, questionsPG, questionsESAI, pgKunci, answers, timeLeft, currentIdx, currentMode, cheatCount, cheatLog, time: new Date().getTime() };
        localStorage.setItem('cbt_session', JSON.stringify(data));
    }

    function loadFromLocal() {
        const saved = localStorage.getItem('cbt_session');
        if (saved) {
            const data = JSON.parse(saved);
            if (new Date().getTime() - data.time < 4 * 60 * 60 * 1000) { // Valid 4 jam
                if (confirm("Pekerjaan sebelumnya ditemukan. Lanjutkan?")) {
                    Object.assign(window, data); // Restore variables
                    document.getElementById('loginPage').classList.add('hidden');
                    document.getElementById('examPage').classList.remove('hidden');
                    document.getElementById('timerDisplay').classList.remove('hidden');
                    startTimer();
                    switchMode(currentMode);
                    showSoal(currentIdx);
                } else { localStorage.removeItem('cbt_session'); }
            }
        }
    }

    window.onload = loadFromLocal;

    // --- CORE LOGIC ---
    async function callGAS(action, data = {}) {
        const res = await fetch(GAS_URL, { method: "POST", body: JSON.stringify({ action, ...data }) });
        return res.json();
    }

    async function handleLogin(role) {
        const kelas = document.getElementById('kelas').value;
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const res = await callGAS('loginUser', { kelas, username, password, role });
        if (res.success) {
            userData = { ...res, kelas };
            document.getElementById('loginPage').classList.add('hidden');
            if (role === 'siswa') {
                document.getElementById('subjectPage').classList.remove('hidden');
                document.getElementById('welcomeUser').innerText = "Halo, " + res.nama;
            } else { location.reload(); /* Tambahkan dashboard guru jika perlu */ }
        } else { alert(res.msg); }
    }

    async function startExamSequence() {
        const mapel = document.getElementById('mapel').value;
        document.getElementById('btnMulai').innerText = "MEMUAT SOAL...";
        const config = await callGAS('getExamConfig', { mapel, tingkat: userData.kelas.substring(0,1) });
        if (config) {
            const [pg, esai] = await Promise.all([
                callGAS('fetchQuestions', { url: config.pgUrl, type: 'PG' }),
                callGAS('fetchQuestions', { url: config.esaiUrl, type: 'ESAI' })
            ]);
            questionsPG = pg; questionsESAI = esai;
            pgKunci = pg.map(q => q.kunci);
            document.getElementById('subjectPage').classList.add('hidden');
            document.getElementById('examPage').classList.remove('hidden');
            document.getElementById('timerDisplay').classList.remove('hidden');
            startTimer();
            switchMode('PG');
        }
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            let m = Math.floor(timeLeft / 60), s = timeLeft % 60;
            document.getElementById('timerDisplay').innerText = `${m}:${s < 10 ? '0'+s : s}`;
            if (timeLeft <= 0) { clearInterval(timerInterval); finalSubmit("Waktu Habis"); }
            timeLeft--;
            if (timeLeft % 5 === 0) saveToLocal();
        }, 1000);
    }

    function switchMode(mode) {
        currentMode = mode;
        questions = (mode === 'PG') ? questionsPG : questionsESAI;
        renderNav();
        showSoal(0);
    }

    function showSoal(idx) {
        currentIdx = idx;
        const q = questions[idx];
        if (!q) return;
        let h = `<div class='text-xl font-bold mb-4'>${idx+1}. ${q.soal}</div>`;
        if (q.img) h = `<img src="${q.img}" class="max-h-48 mb-4">` + h;
        
        if (currentMode === 'PG') {
            ['A','B','C','D'].forEach(o => {
                const checked = answers["PG_"+idx] === o ? 'checked' : '';
                h += `<label class="block p-3 border rounded-lg mb-2 hover:bg-gray-50 cursor-pointer">
                    <input type="radio" name="opt" onclick="saveAns('${o}')" ${checked}> ${o}. ${q[o.toLowerCase()]}
                </label>`;
            });
        } else {
            h += `<textarea class="w-full border p-4 rounded-xl h-40" oninput="saveAns(this.value)">${answers["ESAI_"+idx] || ""}</textarea>`;
        }
        document.getElementById('soalContainer').innerHTML = h;
        document.getElementById('prevBtn').classList.toggle('hidden', idx === 0);
        document.getElementById('nextBtn').classList.toggle('hidden', idx === questions.length - 1);
        document.getElementById('finishBtn').classList.toggle('hidden', !(currentMode === 'ESAI' && idx === questions.length - 1));
        MathJax.typesetPromise();
        updateNavUI();
    }

    function saveAns(v) { 
        answers[currentMode + "_" + currentIdx] = v; 
        updateNavUI();
        saveToLocal();
    }

    function renderNav() {
        let h = '';
        questions.forEach((_, i) => h += `<div onclick="showSoal(${i})" class="question-nav" id="nav-${i}">${i+1}</div>`);
        document.getElementById('navGrid').innerHTML = h;
    }

    function updateNavUI() {
        document.querySelectorAll('.question-nav').forEach((el, i) => {
            el.classList.remove('active', 'done');
            if (i === currentIdx) el.classList.add('active');
            if (answers[currentMode + "_" + i]) el.classList.add('done');
        });
    }

    function changeSoal(s) { showSoal(currentIdx + s); }

    function handleStepTransition() { if(confirm("Kumpulkan jawaban?")) finalSubmit("Selesai Normal"); }

    async function finalSubmit(status) {
        clearInterval(timerInterval);
        localStorage.removeItem('cbt_session');
        document.body.innerHTML = "<div class='h-screen flex items-center justify-center font-bold'>MENGIRIM JAWABAN...</div>";
        await callGAS('processFinalSubmit', { 
            kelas: userData.kelas, row: userData.row, answers, pgKunci, status, 
            pelanggaran: cheatCount, catatan: cheatLog.join("\n") 
        });
        alert("Terima kasih, ujian selesai!"); location.reload();
    }

    // Keamanan
    window.addEventListener('blur', () => {
        if (timeLeft > 0 && userData.nama) {
            cheatCount++;
            cheatLog.push(`[${new Date().toLocaleTimeString()}] Keluar`);
            saveToLocal();
            alert("Dilarang keluar halaman! Pelanggaran: " + cheatCount);
            if (cheatCount >= 5) finalSubmit("Diskualifikasi");
        }
    });
</script>
</body>
</html>
