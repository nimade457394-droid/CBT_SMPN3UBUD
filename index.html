<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT SMP Negeri 3 Ubud - Secured</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { background-color: #f8fafc; user-select: none; -webkit-user-select: none; }
        .header-blue { background-color: #1e3a8a; }
        .question-nav { cursor: pointer; border: 2px solid #e2e8f0; min-width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: white; font-weight: bold; }
        .question-nav.active { background-color: #1e3a8a; color: white; border-color: #1e3a8a; }
        .question-nav.done { background-color: #10b981; color: white; border-color: #10b981; }
        #securityOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999; color: white; text-align: center; padding-top: 20%; }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="securityOverlay">
    <h1 class="text-4xl font-bold mb-4">AKSES DIBLOKIR</h1>
    <p class="text-xl">Dilarang menggunakan Split Screen atau mengubah ukuran jendela!<br>Kembalikan ke layar penuh untuk melanjutkan.</p>
</div>

<div class="header-blue p-4 text-white flex items-center shadow-lg sticky top-0 z-50">
  <img src="https://i.ibb.co.com/SY0R8c8/images.jpg" class="h-8 mr-3 bg-white p-1 rounded">
  <h1 class="text-lg font-bold uppercase">CBT SMPN 3 UBUD</h1>
</div>

<div id="app" class="container mx-auto p-4 max-w-5xl">
  <!-- Login Page -->
  <div id="loginPage" class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-xl mt-10">
    <h2 class="text-2xl font-bold text-center mb-6">Login Siswa/Guru</h2>
    <div class="space-y-4">
      <select id="kelas" class="w-full border p-3 rounded-lg"><option value="">-- Pilih Kelas --</option><option>7A</option><option>7B</option><option>8A</option><option>8B</option><option>9A</option><option>9B</option></select>
      <input type="text" id="username" placeholder="Username" class="w-full border p-3 rounded-lg">
      <input type="password" id="password" placeholder="Password" class="w-full border p-3 rounded-lg">
      <div class="flex gap-2">
        <button onclick="handleLogin('siswa')" class="w-1/2 bg-blue-700 text-white p-3 rounded-lg font-bold">SISWA</button>
        <button onclick="handleLogin('guru')" class="w-1/2 bg-emerald-600 text-white p-3 rounded-lg font-bold">GURU</button>
      </div>
    </div>
  </div>

  <!-- Subject Selection -->
  <div id="subjectPage" class="hidden max-w-md mx-auto bg-white p-8 rounded-2xl shadow-xl mt-10 text-center">
    <h2 id="welcomeUser" class="text-xl font-bold mb-4"></h2>
    <select id="mapel" class="w-full border p-3 rounded-lg mb-4">
        <option>Matematika</option><option>Bahasa Indonesia</option><option>IPA</option><option>IPS</option><option>Bahasa Inggris</option>
    </select>
    <button id="btnMulai" onclick="startExam()" class="w-full bg-blue-700 text-white p-4 rounded-lg font-bold">MULAI UJIAN</button>
  </div>

  <!-- Exam Page -->
  <div id="examPage" class="hidden grid grid-cols-12 gap-6 mt-4">
    <div class="col-span-12 lg:col-span-9 bg-white p-6 rounded-2xl shadow-lg border">
      <div class="flex justify-between items-center mb-6 border-b pb-4">
        <span id="infoNomor" class="font-bold text-lg"></span>
        <div id="timer" class="bg-red-100 text-red-600 px-4 py-2 rounded-lg font-bold text-xl">00:00</div>
      </div>
      <div id="soalContainer" class="min-h-[300px]"></div>
      <div class="flex justify-between mt-8">
        <button id="prevBtn" onclick="changeSoal(-1)" class="bg-gray-200 px-6 py-2 rounded-lg font-bold">Kembali</button>
        <button id="nextBtn" onclick="changeSoal(1)" class="bg-blue-700 text-white px-6 py-2 rounded-lg font-bold">Lanjut</button>
        <button id="finishBtn" onclick="trySubmit()" class="hidden bg-emerald-600 text-white px-6 py-2 rounded-lg font-bold">Kumpulkan</button>
      </div>
    </div>
    <div class="col-span-12 lg:col-span-3 bg-white p-4 rounded-2xl shadow-lg border h-fit">
      <div class="flex gap-2 mb-4">
        <button id="tabPG" onclick="switchMode('PG')" class="flex-1 py-1 rounded bg-blue-700 text-white text-xs font-bold">PG</button>
        <button id="tabESAI" onclick="switchMode('ESAI')" class="flex-1 py-1 rounded bg-gray-100 text-xs font-bold">ESAI</button>
      </div>
      <div id="navGrid" class="flex flex-wrap gap-2 justify-center"></div>
    </div>
  </div>

  <!-- Teacher Dashboard -->
  <div id="teacherDashboard" class="hidden mt-6 bg-white p-6 rounded-2xl shadow-lg border">
      <h2 class="text-2xl font-bold mb-4">Hasil Ujian</h2>
      <select id="selKls" onchange="loadRekap(this.value)" class="border p-2 rounded mb-4"><option value="">-- Pilih Kelas --</option><option>7A</option><option>7B</option></select>
      <div id="rekapContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
  </div>
</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbzLAWOn9MRMVCwG4V-IieGwrSr5mh7dinc_KugSS_rT7nRWOvu_MSUHVAjPIvxv0X4nqw/exec";

  let userData = {}, questionsPG = [], questionsESAI = [], questions = [], 
      currentIdx = 0, answers = {}, timeLeft = 0, timerInterval, currentMode = 'PG', 
      cheatCount = 0, cheatLog = [], pgKunci = [], isWarningActive = false;

  // -- ANTI REFRESH: Cek LocalStorage --
  window.onload = () => {
    const saved = localStorage.getItem('cbt_session');
    if (saved) {
      const data = JSON.parse(saved);
      userData = data.userData;
      answers = data.answers;
      cheatCount = data.cheatCount;
      cheatLog = data.cheatLog;
      timeLeft = data.timeLeft;
      questionsPG = data.questionsPG;
      questionsESAI = data.questionsESAI;
      pgKunci = data.pgKunci;
      
      if (userData.username) {
        document.getElementById('loginPage').classList.add('hidden');
        resumeExam();
      }
    }
  };

  function saveProgress() {
    localStorage.setItem('cbt_session', JSON.stringify({
      userData, answers, cheatCount, cheatLog, timeLeft, questionsPG, questionsESAI, pgKunci, currentMode
    }));
  }

  async function callGAS(action, data = {}) {
    try {
      const res = await fetch(GAS_URL, { method: "POST", body: JSON.stringify({ action, ...data }) });
      return await res.json();
    } catch (e) { return null; }
  }

  async function handleLogin(role) {
    const kls = document.getElementById('kelas').value, user = document.getElementById('username').value, pass = document.getElementById('password').value;
    if(!user || !pass) return alert("Isi lengkap!");
    const res = await callGAS('loginUser', { kelas: kls, username: user, password: pass, role: role });
    if (res && res.success) {
      userData = { ...res, kelas: kls };
      document.getElementById('loginPage').classList.add('hidden');
      if (role === 'siswa') {
        document.getElementById('subjectPage').classList.remove('hidden');
        document.getElementById('welcomeUser').innerText = "Halo, " + res.nama;
      } else { document.getElementById('teacherDashboard').classList.remove('hidden'); }
    } else alert("Login Gagal!");
  }

  async function startExam() {
    const mapel = document.getElementById('mapel').value;
    document.getElementById('btnMulai').innerText = "Memuat...";
    const config = await callGAS('getExamConfig', { mapel, tingkat: userData.kelas.substring(0,1) });
    if(!config) return alert("Soal tidak tersedia!");

    const [pg, esai] = await Promise.all([
      callGAS('fetchQuestions', { url: config.pgUrl, type: 'PG' }),
      callGAS('fetchQuestions', { url: config.esaiUrl, type: 'ESAI' })
    ]);

    questionsPG = pg || [];
    questionsESAI = esai || [];
    pgKunci = questionsPG.map(q => q.kunci);
    timeLeft = 60 * 60; // 60 Menit
    
    resumeExam();
  }

  function resumeExam() {
    document.getElementById('subjectPage').classList.add('hidden');
    document.getElementById('examPage').classList.remove('hidden');
    switchMode('PG');
    if(!timerInterval) startTimer();
    saveProgress();
  }

  function startTimer() {
    timerInterval = setInterval(() => {
      timeLeft--;
      let m = Math.floor(timeLeft/60), s = timeLeft%60;
      document.getElementById('timer').innerText = `${m}:${s<10?'0'+s:s}`;
      if(timeLeft % 10 === 0) saveProgress();
      if(timeLeft <= 0) { clearInterval(timerInterval); finalSubmit("Waktu Habis"); }
    }, 1000);
  }

  function switchMode(mode) {
    currentMode = mode;
    questions = (mode === 'PG') ? questionsPG : questionsESAI;
    document.getElementById('tabPG').className = mode==='PG' ? "flex-1 py-1 rounded bg-blue-700 text-white text-xs font-bold" : "flex-1 py-1 rounded bg-gray-100 text-xs font-bold";
    document.getElementById('tabESAI').className = mode==='ESAI' ? "flex-1 py-1 rounded bg-emerald-600 text-white text-xs font-bold" : "flex-1 py-1 rounded bg-gray-100 text-xs font-bold";
    renderNav();
    showSoal(0);
  }

  function showSoal(idx) {
    currentIdx = idx;
    if (questions.length === 0) {
      document.getElementById('soalContainer').innerHTML = "Tidak ada soal.";
      return;
    }
    const q = questions[idx];
    document.getElementById('infoNomor').innerText = `${currentMode} - No ${idx+1}`;
    let h = q.img ? `<img src="${q.img}" class="max-h-40 mb-4 mx-auto">` : '';
    h += `<div class="text-xl mb-6 font-medium">${q.soal}</div>`;
    
    if (currentMode === 'PG') {
      ['a','b','c','d'].forEach(o => {
        const val = o.toUpperCase();
        const checked = answers["PG_"+idx] === val ? 'checked' : '';
        h += `<label class="block p-3 border rounded-lg mb-2 cursor-pointer hover:bg-gray-50">
          <input type="radio" name="opt" onclick="saveAns('${val}')" ${checked}> ${val}. ${q[o]}
        </label>`;
      });
    } else {
      h += `<textarea oninput="saveAns(this.value)" class="w-full border p-3 rounded-lg h-32" placeholder="Jawaban esai...">${answers["ESAI_"+idx]||''}</textarea>`;
    }
    document.getElementById('soalContainer').innerHTML = h;
    MathJax.typesetPromise();
    updateNavUI();
  }

  function saveAns(v) { 
    answers[currentMode + "_" + currentIdx] = v; 
    updateNavUI(); 
    saveProgress();
  }

  function renderNav() {
    let h = '';
    questions.forEach((_, i) => h += `<div id="nav-${i}" onclick="showSoal(${i})" class="question-nav">${i+1}</div>`);
    document.getElementById('navGrid').innerHTML = h;
    updateNavUI();
  }

  function updateNavUI() {
    document.querySelectorAll('.question-nav').forEach((el, i) => {
      el.classList.remove('active', 'done');
      if (i === currentIdx) el.classList.add('active');
      if (answers[currentMode + "_" + i]) el.classList.add('done');
    });
    document.getElementById('prevBtn').style.visibility = currentIdx === 0 ? 'hidden' : 'visible';
    document.getElementById('nextBtn').classList.toggle('hidden', currentIdx === questions.length - 1);
    document.getElementById('finishBtn').classList.toggle('hidden', !(currentMode === 'ESAI' && currentIdx === questions.length -1));
  }

  function changeSoal(s) { showSoal(currentIdx + s); }

  function trySubmit() { if(confirm("Kumpulkan jawaban?")) finalSubmit("Selesai Normal"); }

  async function finalSubmit(status) {
    clearInterval(timerInterval);
    document.getElementById('examPage').innerHTML = "<div class='text-center p-10 font-bold'>Mengirim jawaban...</div>";
    await callGAS('processFinalSubmit', { 
        kelas: userData.kelas, row: userData.row, answers, pgKunci, status, 
        pelanggaran: cheatCount, catatan: cheatLog.join("\n") 
    });
    localStorage.removeItem('cbt_session');
    alert("Berhasil!");
    location.reload();
  }

  // -- SECURITY LOGIC --
  window.addEventListener('blur', () => {
    if (timeLeft > 0) {
      cheatCount++;
      cheatLog.push(`[${new Date().toLocaleTimeString()}] Keluar/Pindah Tab`);
      saveProgress();
      if (cheatCount >= 3) {
        alert("PELANGGARAN MAKSIMAL! Sistem otomatis mengumpulkan.");
        finalSubmit("Diskualifikasi (Pindah Tab)");
      } else {
        alert("PERINGATAN: Jangan keluar dari layar ujian! Pelanggaran: " + cheatCount + "/3");
      }
    }
  });

  window.addEventListener('resize', () => {
    if (timeLeft > 0) {
      if (window.innerWidth < screen.width * 0.8) {
        document.getElementById('securityOverlay').style.display = 'block';
      } else {
        document.getElementById('securityOverlay').style.display = 'none';
      }
    }
  });
</script>
</body>
</html>
